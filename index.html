<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Neon Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050A18">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Player">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css?v=7">
</head>
<body>
<div id="app">

  <!-- carregando -->
  <section id="t-carga" class="tela ativa">
    <img class="marca-g" src="img/icone-512.png" alt="Neon Player" width="132" height="132">
    <div class="rodando"></div>
    <div class="status" id="carga-status">Abrindo…</div>
  </section>

  <!-- entrar com usuário e senha da lista -->
  <section id="t-entrar" class="tela">
    <form class="entrar" id="form-entrar" autocomplete="on" novalidate>
      <div class="lado-a">
        <img class="marca-g" src="img/icone-512.png" alt="Neon Player" width="108" height="108">
        <h1>Entrar</h1>
        <p>Use o usuário e a senha da sua lista.</p>
      </div>
      <div class="lado-b">
        <label class="campo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/></svg>
          <input id="in-usuario" name="username" type="text" inputmode="text" placeholder="Usuário" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">
        </label>
        <label class="campo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="in-senha" name="password" type="password" placeholder="Senha" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
          <button type="button" id="ver-senha" aria-label="Mostrar a senha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </label>
        <div class="erro" id="entrar-erro" role="alert"></div>
        <button class="btn p cheio" id="btn-entrar" type="submit">Entrar</button>
        <button class="link" id="btn-demo" type="button" hidden>Ver demonstração</button>
        <button class="link" id="btn-instalar" type="button" hidden>Instalar na tela de início</button>
      </div>
    </form>
  </section>

  <!-- aviso (bloqueado, vencido, lista com problema, sem conexão) -->
  <section id="t-aviso" class="tela">
    <div>
      <span class="aviso-selo" id="aviso-selo"></span>
      <h1 id="aviso-titulo"></h1>
      <p id="aviso-texto"></p>
      <div class="acoes">
        <button class="btn p" id="aviso-tentar">Tentar de novo</button>
        <button class="btn s" id="aviso-sair">Entrar com outro usuário</button>
      </div>
    </div>
  </section>

  <!-- o app -->
  <div id="casca" hidden>
    <header id="barra">
      <div class="logo"><i><img src="img/icone-192.png" alt="" width="32" height="32"></i><span id="barra-nome">Neon Player</span></div>
      <nav id="guias">
        <button data-pag="inicio">Início</button>
        <button data-pag="tv">TV ao Vivo</button>
        <button data-pag="filmes">Filmes</button>
        <button data-pag="series">Séries</button>
      </nav>
      <div class="espaco" id="barra-espaco"></div>
      <label id="busca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="in-busca" type="search" placeholder="Buscar" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
      </label>
      <button class="ico" id="btn-busca" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="ico" id="btn-atualizar" aria-label="Atualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></svg></button>
      <button class="ico" id="btn-config" aria-label="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>

    <main id="miolo">
      <!-- Início -->
      <section id="t-inicio" class="pag">
        <div id="capa">
          <div class="arte" id="arte-a"></div>
          <div class="arte" id="arte-b"></div>
          <div class="veu"></div>
          <div class="dentro">
            <div class="sobretitulo">EM DESTAQUE</div>
            <h2 id="capa-titulo"></h2>
            <div class="meta" id="capa-meta"></div>
            <div class="acoes">
              <button class="btn branco" id="capa-assistir"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Assistir</button>
              <button class="btn s" id="capa-detalhes">Detalhes</button>
            </div>
          </div>
        </div>
        <div class="faixa" id="faixa-demo" hidden></div>
        <div id="fileiras"></div>
        <div class="rodape" id="rodape"></div>
      </section>

      <!-- TV ao Vivo -->
      <section id="t-tv" class="pag">
        <div id="tv-cats"></div>
        <div id="tv-previa">
          <video id="v-tv" playsinline webkit-playsinline preload="none"></video>
          <div class="sobre-v" id="tv-sobre">Escolha um canal</div>
          <button class="ico cheia" id="tv-cheia" aria-label="Tela cheia" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
        <div id="tv-info">
          <div class="txt"><div class="canal" id="tv-canal">TV ao Vivo</div><div class="agora" id="tv-agora"></div></div>
          <button class="ico" id="tv-fav" aria-label="Favoritar" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.500l6.1-.9z"/></svg></button>
        </div>
        <div id="tv-epg"></div>
        <button id="tv-cat-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span id="tv-cat-nome">Todos os canais</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <div id="tv-canais"></div>
      </section>

      <!-- Filmes e Séries (a mesma tela, como no Android) -->
      <section id="t-vod" class="pag">
        <div id="vod-cats"></div>
        <div id="vod-topo">
          <button id="vod-cat-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span id="vod-cat-nome">Tudo</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
          <span id="vod-conta"></span>
        </div>
        <div id="vod-grade-rol"><div id="vod-grade"></div><div id="vod-fim"></div></div>
      </section>

      <!-- Configurações -->
      <section id="t-config" class="pag"><div class="dentro" id="config-dentro"></div></section>
    </main>

    <nav id="abas">
      <button data-pag="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Início</button>
      <button data-pag="tv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 3l4 4 4-4"/></svg>TV ao Vivo</button>
      <button data-pag="filmes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>Filmes</button>
      <button data-pag="series"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17.500l9 5 9-5"/></svg>Séries</button>
    </nav>
  </div>

  <!-- ficha do filme / da série -->
  <section id="t-ficha" class="sobre">
    <button class="ico voltar" id="ficha-voltar" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="ficha-arte"></div>
    <div id="ficha-corpo">
      <img id="ficha-poster" alt="" referrerpolicy="no-referrer">
      <div id="ficha-txt"><h2 id="ficha-titulo"></h2><div id="ficha-meta"></div></div>
    </div>
    <div id="ficha-baixo">
      <div id="ficha-acoes"></div>
      <div id="ficha-sinopse"></div>
      <div id="ficha-dados"></div>
      <div id="temporadas" hidden></div>
      <div id="episodios"></div>
    </div>
  </section>

  <!-- player de filme, episódio e canal em tela cheia -->
  <section id="t-player" class="sobre">
    <video id="v-pl" playsinline webkit-playsinline controls preload="metadata"></video>
    <div id="pl-msg" hidden></div>
    <div id="pl-topo">
      <button class="ico" id="pl-voltar" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div id="pl-titulo"></div>
    </div>
    <button class="btn branco" id="pl-prox" hidden>Próximo episódio</button>
  </section>

  <div id="folha"><div class="caixa" id="folha-caixa"></div></div>
  <div id="toast"></div>
</div>

<script src="js/vendor/hls.light.min.js?v=1.5.17"></script>
<script src="js/base.js?v=1"></script>
<script src="js/titulos.js?v=1"></script>
<script src="js/destaques.js?v=1"></script>
<script src="js/dados.js?v=2"></script>
<script src="js/tocador.js?v=1"></script>
<script src="js/telas.js?v=7"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
